<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Jatuh Suka</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;

      display: flex;
      justify-content: center;
      align-items: center;

      background: #030303;
      color: white;

      font-family: Arial, sans-serif;
    }

    /* ===== BACKGROUND ===== */

    .background {
      position: fixed;
      inset: 0;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 20% 20%,
          #30002e,
          transparent 40%
        ),
        radial-gradient(
          circle at 80% 80%,
          #18003a,
          transparent 40%
        ),
        #020202;
    }

    .blob {
      position: absolute;

      width: 330px;
      height: 330px;

      border-radius: 50%;

      filter: blur(80px);

      opacity: 0.35;

      animation: liquid 12s infinite alternate ease-in-out;
    }

    .blob1 {
      background: #a0007a;
      top: -120px;
      left: -120px;
    }

    .blob2 {
      background: #4c00b8;
      bottom: -120px;
      right: -120px;

      animation-delay: 3s;
    }

    .blob3 {
      background: #62002f;
      top: 45%;
      left: 40%;

      animation-delay: 6s;
    }

    @keyframes liquid {

      0% {
        transform: translate(0, 0) scale(1);
      }

      50% {
        transform: translate(100px, -70px) scale(1.3);
      }

      100% {
        transform: translate(-80px, 100px) scale(0.9);
      }

    }


    /* ===== GLASS ===== */

    .glass {

      position: relative;
      z-index: 5;

      width: 90%;
      max-width: 500px;

      padding: 30px;

      border-radius: 28px;

      background: rgba(255,255,255,0.06);

      border: 1px solid rgba(255,255,255,0.12);

      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);

      box-shadow:
        inset 0 1px 1px rgba(255,255,255,0.12),
        0 25px 70px rgba(0,0,0,0.7);
    }


    /* ===== TITLE ===== */

    h1 {

      margin: 0 0 8px;

      text-align: left;

      font-size: 28px;

      font-weight: 600;

      letter-spacing: 1px;
    }

    .sub {

      margin-bottom: 30px;

      text-align: left;

      color: rgba(255,255,255,0.4);

      font-size: 13px;
    }


    /* ===== LIRIK ===== */

    #lirik {

      min-height: 190px;

      text-align: left;
    }

    .line {

      margin-bottom: 18px;

      font-size: 18px;

      line-height: 1.5;

      color: rgba(255,255,255,0.9);

      min-height: 27px;
    }


    /* ===== CURSOR ===== */

    .cursor {

      display: inline-block;

      width: 2px;
      height: 20px;

      margin-left: 3px;

      vertical-align: middle;

      background: white;

      animation: blink 0.65s infinite;
    }

    @keyframes blink {

      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }

    }


    /* ===== BUTTON ===== */

    button {

      width: 100%;

      margin-top: 15px;

      padding: 13px;

      border-radius: 15px;

      border: 1px solid rgba(255,255,255,0.15);

      background: rgba(255,255,255,0.08);

      color: white;

      font-size: 15px;

      cursor: pointer;

      transition: 0.2s;
    }

    button:active {

      transform: scale(0.97);

      background: rgba(255,255,255,0.15);

    }

  </style>
</head>


<body>


  <!-- BACKGROUND -->

  <div class="background">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>
    <div class="blob blob3"></div>

  </div>


  <!-- LIQUID GLASS -->

  <div class="glass">

    <h1>jatuh suka</h1>

    <div class="sub">
      sebuah perasaan yang datang begitu saja...
    </div>


    <div id="lirik"></div>


    <button onclick="mulai()">
      ▶ mulai
    </button>

  </div>


  <script>

    const lirik = [

      "ini semua bukan salah mu...",

      "punya magis perekat yang sekuatt itu...",

      "dari lahir sudah begitu..",

      "maafkan.........",

      "aku jatuh sukaa"

    ];


    const tempat =
      document.getElementById("lirik");


    let berjalan = false;


    async function ketik(teks) {

      const baris =
        document.createElement("div");

      baris.className = "line";


      const tulisan =
        document.createElement("span");

      const cursor =
        document.createElement("span");

      cursor.className = "cursor";


      baris.appendChild(tulisan);

      baris.appendChild(cursor);

      tempat.appendChild(baris);


      /* mengetik huruf demi huruf */

      for (let i = 0; i < teks.length; i++) {

        tulisan.textContent += teks[i];

        await tunggu(65);

      }


      /* tunggu sebelum lanjut */

      await tunggu(1200);


      cursor.remove();

    }


    function tunggu(ms) {

      return new Promise(
        resolve => setTimeout(resolve, ms)
      );

    }


    async function mulai() {

      if (berjalan) return;

      berjalan = true;

      tempat.innerHTML = "";


      for (const teks of lirik) {

        await ketik(teks);

      }


      berjalan = false;

    }

  </script>


</body>
</html>
